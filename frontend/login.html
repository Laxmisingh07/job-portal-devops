<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Job Portal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="container">

        <h1>Job Portal</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            Don't have an account?
            <a href="register.html">
                Register
            </a>
        </p>

    </div>

    <script src="js/script.js"></script>

    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                try {

                    const data = await apiRequest(
                        "/auth/login",
                        "POST",
                        {
                            email,
                            password
                        }
                    );

                    saveLogin(data);

                    message.textContent =
                        "Login successful!";

                    setTimeout(function() {

                        window.location.href =
                            "jobs.html";

                    }, 1000);

                } catch (error) {

                    message.textContent =
                        error.message;

                }

            });

    </script>

</body>

</html>
